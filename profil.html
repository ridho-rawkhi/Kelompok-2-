<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profil MotoGP Rider</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,400;0,700;0,900;1,400&family=Racing+Sans+One&display=swap" rel="stylesheet">
    <style>
        /* CSS Reset & Basic Setup */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #111;
            /* Latar belakang dengan tekstur serat karbon / gelap */
            background-image: repeating-linear-gradient(45deg, #1a1a1a 25%, transparent 25%, transparent 75%, #1a1a1a 75%, #1a1a1a), repeating-linear-gradient(45deg, #1a1a1a 25%, #111 25%, #111 75%, #1a1a1a 75%, #1a1a1a);
            background-position: 0 0, 10px 10px;
            background-size: 20px 20px;
            font-family: 'Montserrat', sans-serif;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        /* Kartu Profil Utama */
        .profile-card {
            background: linear-gradient(135deg, #222 0%, #000 100%);
            width: 100%;
            max-width: 400px;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(229, 0, 0, 0.3), inset 0 0 0 2px #333;
            text-align: center;
            position: relative;
            overflow: hidden;
            transition: transform 0.3s ease;
        }

        .profile-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 40px rgba(229, 0, 0, 0.5), inset 0 0 0 2px #e50000;
        }

        /* Garis Balap di atas kartu */
        .racing-stripe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 8px;
            background: repeating-linear-gradient(90deg, #fff, #fff 10px, #000 10px, #000 20px);
        }

        /* Foto Profil */
        .profile-pic {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            margin: 20px auto;
            border: 4px solid #e50000;
            padding: 5px;
            background-color: #000;
            /* Ganti URL ini dengan foto kamu atau foto rider favoritmu */
            background-image: url('https://images.unsplash.com/photo-1561361513-2d000a50f0dc?ixlib=rb-4.0.3&auto=format&fit=crop&w=500&q=60');
            background-size: cover;
            background-position: center;
            box-shadow: 0 0 20px rgba(229, 0, 0, 0.5);
        }

        /* Nama dan Julukan */
        h1 {
            font-family: 'Racing Sans One', display;
            font-size: 2.2rem;
            color: #fff;
            margin-bottom: 5px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        h2 {
            font-size: 1rem;
            color: #e50000;
            font-style: italic;
            font-weight: 700;
            margin-bottom: 20px;
        }

        /* Statistik / Info Rider */
        .stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 25px;
        }

        .stat-box {
            background: rgba(255, 255, 255, 0.05);
            padding: 10px;
            border-radius: 8px;
            border-left: 3px solid #e50000;
        }

        .stat-box p.title {
            font-size: 0.8rem;
            color: #aaa;
            text-transform: uppercase;
            font-weight: 700;
            margin-bottom: 5px;
        }

        .stat-box p.value {
            font-size: 1.1rem;
            font-weight: 900;
            font-style: italic;
        }

        /* Tombol Aksi */
        .btn {
            display: inline-block;
            background: #e50000;
            color: #fff;
            text-decoration: none;
            padding: 12px 25px;
            border-radius: 30px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.3s ease;
            font-family: 'Racing Sans One', display;
            font-size: 1.1rem;
            width: 100%;
        }

        .btn:hover {
            background: #ff0000;
            box-shadow: 0 0 15px #e50000;
            transform: scale(1.05);
        }

        /* Deskripsi Singkat */
        .bio {
            font-size: 0.9rem;
            color: #ccc;
            line-height: 1.5;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>

    <div class="profile-card">
        <div class="racing-stripe"></div>
        
        <div class="profile-pic"></div>
        
        <h1>Nama Kamu</h1>
        <h2>"The Asphalt King"</h2>
        
        <p class="bio">Penggemar berat kecepatan, tikungan tajam, dan aroma bahan bakar. Selalu siap melaju di lintasan kehidupan dengan gigi maksimal!</p>
        
        <div class="stats">
            <div class="stat-box">
                <p class="title">Tim Favorit</p>
                <p class="value">Ducati Lenovo</p>
            </div>
            <div class="stat-box">
                <p class="title">Nomor Motor</p>
                <p class="value">#93</p>
            </div>
            <div class="stat-box">
                <p class="title">Riding Style</p>
                <p class="value">Aggressive</p>
            </div>
            <div class="stat-box">
                <p class="title">Sirkuit Favorit</p>
                <p class="value">Mugello</p>
            </div>
        </div>

        <a href="#" class="btn">Masuk Ke Paddock</a>
    </div>

</body>
</html>
